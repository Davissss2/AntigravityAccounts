<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#120c24" />
      <stop offset="100%" stop-color="#05030a" />
    </radialGradient>

    <!-- Gradients matching the user's logo -->
    <linearGradient id="bluePurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="magentaPink" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Stylized AG logo elements -->
  <!-- A Left stroke (ribbon) -->
  <path d="M 155,370 L 225,130 L 265,130 L 195,370 Z" fill="url(#bluePurple)" />
  <!-- A Crossbar -->
  <path d="M 180,270 L 255,270 L 245,300 L 170,300 Z" fill="url(#bluePurple)" />

  <!-- Combined right of A and back of G -->
  <path d="M 245,130 C 310,130 360,180 360,245 C 360,310 310,360 245,360 C 215,360 195,345 195,345 L 215,315 C 215,315 230,328 245,328 C 290,328 325,293 325,245 C 325,197 290,162 245,162 L 235,162 Z" fill="url(#magentaPink)" />
  <!-- G Inner shelf -->
  <path d="M 255,230 L 325,230 L 325,260 L 255,260 Z" fill="url(#magentaPink)" />

  <!-- Sleek tilted planetary ring/orbit wrapping around AG -->
  <ellipse cx="256" cy="250" rx="200" ry="45" fill="none" stroke="url(#cyanBlue)" stroke-width="14" transform="rotate(-15 256 250)" filter="url(#neonGlow)" />
  <!-- Arrow head on the planetary ring -->
  <polygon points="310,210 345,195 320,238" fill="url(#cyanBlue)" filter="url(#neonGlow)" />
</svg>
